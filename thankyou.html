<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takk | Bithun Chatterjee</title>

  <!-- Apply saved theme and language BEFORE CSS loads -->
  <script>
    {
      const t = localStorage.getItem("theme");
      if (t === "light") document.documentElement.classList.add("light");
      else if (t === "dark") document.documentElement.classList.add("dark");
      const l = localStorage.getItem("lang");
      if (l) document.documentElement.lang = l;
    }
  </script>

  <!-- Theme + Styles -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/theme-toggle.css">
  <link rel="stylesheet" href="assets/css/lang-toggle.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/panels.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/thankyou.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>

<body>

  <!-- Theme Toggle -->
  <button type="button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme" data-i18n-aria="aria.theme" data-i18n-title="title.theme">🌙</button>

  <!-- Language Toggle -->
  <button type="button" id="lang-toggle" aria-label="Switch to English" title="Switch to English" data-i18n-aria="aria.lang" data-i18n-title="title.lang">EN</button>

  <main>
    <section class="panel thankyou-panel">
      <h1 data-i18n="thankyou.h1">Takk!</h1>
      <p data-i18n="thankyou.msg">Meldingen din er sendt. Jeg tar kontakt så snart som mulig.</p>

      <a href="index.html" class="btn" style="margin-top:20px;" data-i18n="thankyou.back">← Tilbake til forsiden</a>
    </section>
  </main>

  <!-- Scripts -->
  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/lang-toggle.js"></script>
  <script src="assets/js/script.js"></script>

</body>
</html>
